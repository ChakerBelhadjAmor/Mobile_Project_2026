spring.application.name=livraison-backend
server.port=8080

# PostgreSQL connection (values injected via docker-compose env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/livraisondb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Seed data after schema is created
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JSON date format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
